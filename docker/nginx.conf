#***
# nginx in the docair-web container: serves the Angular app's files on 8080
# and passes `/api` on to docair-server.
#
# Unknown paths fall back to index.html, so deep links work. Hashed bundles
# are cached for a year, index.html never. `/api` goes to the server named by
# DOCAIR_SERVER (host:port, default docair-server:8080), filled in when the
# container starts; uploads may be as big as the server takes (25 MB).
#
# nginx is off-the-shelf, not one of docair's programs: a gateway, so the
# Apps layer leaves it out.
#
# @id      nginx
# @kind    gateway
# @part-of container.docair-web
# @calls   docair-web.main (index.html, main-*.js) -> the app, running in the browser
# @calls   docair-server.router (HTTP /api)
# @flow    open 2 "nginx answers with index.html and the app bundle"
# @flow    upload 4 "nginx passes /api/scan on to docair-server"
#***
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://${DOCAIR_SERVER};
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        client_max_body_size 30m;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
