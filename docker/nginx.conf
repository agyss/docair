#***
# nginx in the docair-web container: serves the Angular app's files on 8080.
#
# Unknown paths fall back to index.html, so deep links work. Hashed bundles
# are cached for a year, index.html never. `/api` is not handled here: the
# Ingress sends it to docair-server before it ever reaches this container.
#
# nginx is off-the-shelf, not one of docair's programs: a gateway, like
# Traefik, so the Apps layer leaves it out.
#
# @id      nginx
# @kind    gateway
# @part-of container.docair-web
# @calls   docair-web.main (index.html, main-*.js) -> the app, running in the browser
# @flow    open 7 "nginx answers with index.html and the app bundle"
# @flow    provision 11 "docair-server and nginx listen on port 8080"
#***
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
