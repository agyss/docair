# Reading an environment variable in Node: `process.env.PORT`,
# `process.env['PORT']`. The variable meets what sets it (docs/ADAPTERS.md §5.7).
id: ts.node.env
language: typescript
rule:
  any:
    - pattern: process.env.$NAME
    - pattern: process.env[$NAME]
constraints:
  NAME:
    any:
      - kind: property_identifier
      - kind: string
facts:
  - requests: env
    name: $NAME
    by: enclosing
