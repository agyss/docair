# fetch() without a method is a GET: `fetch('/api/orders')`.
id: ts.fetch-get
language: typescript
rule:
  any:
    - pattern: fetch($URL)
    - all:
        - pattern: fetch($URL, $OPTS)
        - not:
            has:
              stopBy: end
              kind: pair
              has: { field: key, regex: "^.?method.?$" }
constraints:
  URL:
    any:
      - kind: string
      - kind: template_string
facts:
  - requests: http
    method: GET
    path: $URL
    by: enclosing
