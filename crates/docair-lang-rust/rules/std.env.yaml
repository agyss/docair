# Reading an environment variable: `std::env::var("DOCAIR_BIND")`. The
# variable meets what sets it: a Deployment's env, a ConfigMap or Secret key
# (docs/ADAPTERS.md §5.7). A name a caller passes in is the adapter's.
id: rust.std.env
language: rust
rule:
  any:
    - pattern: std::env::var($NAME)
    - pattern: env::var($NAME)
    - pattern: std::env::var_os($NAME)
    - pattern: env::var_os($NAME)
constraints:
  NAME: { kind: string_literal }
facts:
  - requests: env
    name: $NAME
    by: enclosing
