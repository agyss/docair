#***
# The HTTP backend: turns uploaded source files into a docair page.
#
# One binary that contains the whole docair pipeline (core, Rust adapter,
# viewer). In the cluster it runs in the docair-server container.
#
# @id      docair-server
# @kind    service
# @part-of container.docair-server
#***
[package]
name = "docair-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
docair-adapters.workspace = true
anyhow.workspace = true
axum.workspace = true
docair-ai.workspace = true
docair-core.workspace = true
docair-viewer.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tower-http.workspace = true

[dev-dependencies]
tower.workspace = true
