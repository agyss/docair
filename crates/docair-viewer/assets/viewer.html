<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="{{docair:generator}}">
<title>{{docair:title}}</title>
<style>
{{docair:css}}
</style>
</head>
<body>
<!--***
  The viewer page as it runs in the browser: header, tree, graph canvas, details panel and flow player.

  Everything it needs is inlined: the graph, the rendered Markdown, the
  viewer script and the Cytoscape and ELK libraries. It is generated by
  docair-viewer but runs on its own, so it is its own top-level part.

  @id      docair-viewer.page
  @kind    service
  @part-of browser
***-->
<div id="app">
  <header>
    <div class="brand">docair <span id="system-name"></span></div>
    <div class="stats" id="stats"></div>
    <div class="spacer"></div>
    <div class="layers" id="layers" role="group" aria-label="Layer" title="Each layer shows one concern. Scroll out past the whole picture to go back up, scroll into a box to open it, or press - and +."></div>
    <button class="btn" id="btn-dir" title="Layout direction: auto picks the one that fits the screen">Layout: auto</button>
    <button class="btn" id="btn-tests" hidden data-test="tests-toggle"></button>
    <button class="btn" id="btn-glossary" hidden data-test="glossary-button" title="What the words of these docs mean"></button>
    <button class="btn" id="btn-data" hidden data-test="data-button" title="What users and the code make and carry"></button>
    <button class="btn" id="btn-legend">Legend</button>
    <button class="btn" id="btn-fit" title="Fit graph (F)">Fit</button>
    <button class="btn" id="btn-diag"></button>
  </header>
  <aside id="tree">
    <input id="search" type="search" placeholder="Filter nodes…" autocomplete="off">
    <div id="tree-list"></div>
  </aside>
  <main id="graph">
    <div id="cy"></div>
    <div id="tip" hidden></div>
    <div id="legend" hidden></div>
    <div id="toast" hidden></div>
    <div id="crumbs" hidden></div>
    <div id="hidden-bar" hidden data-test="hidden-bar"></div>
    <div id="reader" hidden data-test="reader"></div>
    <div id="follow-bar" hidden data-test="follow-bar"></div>
    <div id="hint">scroll out past the picture: close a box, then up a layer · scroll into a box: open it · double-click: open/close</div>
  </main>
  <aside id="details"><p class="empty">Select a node to see its documentation.</p></aside>
  <footer id="flow"></footer>
  <div id="drawer" hidden></div>
  <div id="term-pop" hidden role="tooltip" data-test="term-pop"></div>
</div>
<script id="docair-graph" type="application/json">{{docair:graph}}</script>
<script id="docair-html" type="application/json">{{docair:html}}</script>
<script>
/* Cytoscape.js 3.34.4, MIT License, (c) The Cytoscape Consortium */
{{docair:cytoscape}}
</script>
<script>
/* elkjs 0.12.1, Eclipse Public License 2.0, source: https://github.com/kieler/elkjs */
{{docair:elk}}
</script>
<script>
{{docair:app}}
</script>
</body>
</html>
