#***
# Renders the graph into one self-contained HTML file.
#
# The page inlines Cytoscape.js (drawing, interaction) and ELK
# (hierarchical layout), so it works offline and can be mailed or archived.
#
# @id      docair-viewer
# @kind    module
# @part-of docair-lib
#***
[package]
name = "docair-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
docair-core.workspace = true
pulldown-cmark = { workspace = true, features = ["html"] }
serde_json.workspace = true
