#***
# The Helm adapter: Helm: a chart's objects with its values filled in, and a chart no Terraform installs as its own release.
# It reports from docair-infra's one reading of all infrastructure code
# (docs/ADAPTERS.md §5.3).
#
# @id      docair-lang-helm
# @kind    module
# @part-of docair-lib
#***
[package]
name = "docair-lang-helm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
docair-core.workspace = true
docair-infra.workspace = true
