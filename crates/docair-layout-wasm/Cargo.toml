#***
# docair-layout's move of a part by hand, built to WebAssembly for the page
# (docs/SLICES.md §7): the page asks it where a moved part's lines go, and
# the router that answers is the one `docair build` lays out with.
#
# The built module is kept in the repository (`layout.wasm`, with the code
# version it was built from), so a build needs no wasm32 target;
# `scripts/build-layout-wasm.sh` builds it again, and a test fails when the
# layout code moved on.
#
# @id      docair-layout-wasm
# @kind    module
# @part-of docair-lib
#***
[package]
name = "docair-layout-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "docair-layout's move of a part, as a WebAssembly module for the page"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
docair-layout = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
