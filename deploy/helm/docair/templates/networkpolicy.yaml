{{/***
 * NetworkPolicy docair: only pods in the namespace traefik may open connections to the apps, and only on port 8080; the server pods may reach each other there too.
 *
 * Nothing else inside the cluster can reach docair-web or docair-server
 * directly; the kubelet's probes from the node are always allowed. A server
 * pod forwards a request for an upload another pod keeps to that pod.
 *
 * @id      k8s.netpol.docair
 * @kind    config
 * @part-of k8s.release.docair
 ***/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docair
  labels:
    {{- include "docair.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: docair
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: docair-server
      ports:
        - port: 8080
          protocol: TCP
{{- end }}
