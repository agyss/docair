{{/***
 * Secret docair-ai: the key for the AI endpoint, handed to the server pods as DOCAIR_AI_API_KEY.
 *
 * Created only when the key is passed in (Terraform reads it from the
 * gitignored .env); with ai.existingSecret the chart uses that Secret instead.
 *
 * @id      k8s.secret.docair-ai
 * @kind    config
 * @part-of k8s.release.docair
 ***/}}
{{- if and .Values.ai.apiKey (not .Values.ai.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: docair-ai
  labels:
    {{- include "docair.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.ai.apiKey | quote }}
{{- end }}
